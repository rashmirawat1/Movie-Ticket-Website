name: Test, build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  docker:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/showtime
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub secrets exist
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$U" ] || [ -z "$T" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Build image
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Run container and check website
        run: |
          docker run -d --name showtime -p 8080:80 $IMAGE:latest
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/ -o page.html && break
            sleep 1
          done
          grep -q "Showtime" page.html
          echo "Website is running inside the container"
          docker rm -f showtime

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
