<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showtime – Book movie tickets</title>
<meta name="theme-color" content="#0a0a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a10;--card:#15151f;--line:#2b2b3b;--ink:#f5f4fa;--mute:#a09eb5;--red:#e5173f;--green:#19c39a;--gold:#f5b942;--pad:max(20px,4vw)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg.art,img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* nav */
nav.top{position:fixed;inset:0 0 auto;z-index:20;transition:background .3s;background:linear-gradient(rgba(10,10,16,.85),transparent)}
nav.top.solid{background:rgba(10,10,16,.94);backdrop-filter:blur(12px)}
.nb{display:flex;align-items:center;gap:22px;padding:14px var(--pad)}
.logo{font-weight:800;font-size:1.7rem;letter-spacing:-.04em;color:#fff}
.logo span{color:var(--red)}
.links{display:flex;gap:20px;font-size:.95rem}
.links a{color:#d6d4e6;text-decoration:none}
.links a:hover{color:#fff}
.sp{flex:1}
.sb{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:1px solid #4a4863;border-radius:99px;padding:6px 14px}
.sb input{background:none;border:0;outline:0;width:150px;color:#fff}
.sb:focus-within{border-color:#fff}
nav select{background:rgba(0,0,0,.45);border:1px solid #4a4863;border-radius:10px;padding:7px 10px;color:#fff}
nav select option{color:#000}
.tix{background:var(--red);color:#fff;padding:8px 18px;border-radius:10px;font-weight:600}

/* hero */
.hero{position:relative;height:min(92vh,800px);min-height:540px;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .bg{position:absolute;inset:0;overflow:hidden}
.slide .bg>*{transform:scale(1.12);transition:transform 9s linear}
.slide.on .bg>*{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,16,.92) 0,rgba(10,10,16,.5) 45%,transparent 78%),linear-gradient(0deg,var(--bg) 0,transparent 38%)}
.hc{position:absolute;z-index:2;left:var(--pad);bottom:19%;max-width:640px;padding-right:20px}
.tg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tg b{font-weight:600;font-size:.82rem;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.14);backdrop-filter:blur(4px)}
.tg b.sc{background:var(--gold);color:#1a1200}
.ht{font-size:clamp(2.6rem,7.5vw,5.6rem);line-height:.95;font-weight:800;letter-spacing:-.045em;text-wrap:balance;margin-bottom:16px}
.hc p.ds{color:#d9d7e8;font-size:1.05rem;max-width:50ch;margin-bottom:24px}
.bt{display:flex;gap:12px;flex-wrap:wrap}
.play{background:#fff;color:#111;padding:12px 28px;border-radius:10px;font-weight:700;font-size:1rem}
.play:hover{background:var(--red);color:#fff}
.ghost{background:rgba(255,255,255,.18);padding:12px 22px;border-radius:10px;font-weight:600;backdrop-filter:blur(6px)}
.ghost:hover{background:rgba(255,255,255,.3)}
.slide.on .hc>*{animation:up .7s both}
.slide.on .hc>*:nth-child(2){animation-delay:.1s}.slide.on .hc>*:nth-child(3){animation-delay:.2s}.slide.on .hc>*:nth-child(4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.thumbs{position:absolute;right:var(--pad);bottom:14%;display:flex;gap:10px;z-index:4;align-items:flex-end}
.th2{width:86px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;position:relative;opacity:.5;outline:2px solid transparent;transition:.25s}
.th2:hover{opacity:.85}
.th2.on{opacity:1;outline-color:#fff;transform:translateY(-8px)}
.dots{display:none;position:absolute;bottom:12px;left:0;right:0;justify-content:center;gap:8px;z-index:4}
.dot{width:8px;height:8px;border-radius:50%;background:#fff5}
.dot.on{background:#fff;width:22px;border-radius:99px}
.ha{position:absolute;top:50%;z-index:4;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);font-size:1.6rem;opacity:0;transition:.2s;transform:translateY(-50%)}
.hero:hover .ha{opacity:1}.ha.l{left:14px}.ha.r{right:14px}.ha:hover{background:rgba(0,0,0,.8)}

/* chips + rows */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--pad);margin:6px 0 24px;scrollbar-width:none}
.chip{flex:none;padding:7px 18px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:.92rem}
.chip.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
.row{margin-bottom:30px}
.row>h2,.rt{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin:0 var(--pad) 8px}
.rw{position:relative}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px var(--pad) 16px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arr{position:absolute;top:10px;bottom:16px;width:var(--pad);min-width:44px;z-index:6;background:rgba(10,10,16,.75);font-size:2.2rem;opacity:0;transition:.2s}
.rw:hover .arr{opacity:1}.arr.l{left:0;border-radius:0 12px 12px 0}.arr.r{right:0;border-radius:12px 0 0 12px}
.card{flex:none;width:176px;scroll-snap-align:start;position:relative;cursor:pointer;transition:transform .22s,box-shadow .22s;border-radius:12px}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:3;box-shadow:0 14px 34px rgba(0,0,0,.6)}
.poster{aspect-ratio:2/3;position:relative;border-radius:12px;overflow:hidden;background:#222}
.sc2{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:99px;font-size:.8rem;font-weight:600;z-index:2}
.sc2.soon{background:var(--gold);color:#1a1200}
.pt{position:absolute;inset:auto 0 0;padding:44px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.9));z-index:2}
.pt h3{font-size:1.25rem;line-height:1.05;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.hv{max-height:0;overflow:hidden;transition:max-height .3s}
.card:hover .hv,.card:focus-visible .hv{max-height:90px}
.hv div{display:flex;gap:10px;font-size:.78rem;color:#d0cee0;margin-top:6px}
.mini{display:inline-block;margin-top:8px;background:var(--red);padding:4px 14px;border-radius:8px;font-size:.82rem;font-weight:600}
.t10 .card{display:flex;align-items:flex-end;width:auto}
.t10 .poster{width:140px;flex:none}
.num{font-size:9.5rem;font-weight:800;line-height:.75;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:3px #5d5b78;margin-right:-26px;position:relative;z-index:0;padding-bottom:6px}
.t10 .card .poster{z-index:1}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;padding:6px var(--pad) 40px}
.res .card{width:auto}
.empty{padding:40px var(--pad);color:var(--mute)}
footer{padding:40px var(--pad) 50px;color:var(--mute);font-size:.88rem;border-top:1px solid var(--line);margin-top:20px}

/* booking view */
#view{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:30}
#view.open{display:block}
.ban{position:relative;height:340px;overflow:hidden;background:#000}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,16,.85),transparent 70%),linear-gradient(0deg,var(--bg),transparent 55%)}
.back{position:absolute;top:16px;left:var(--pad);z-index:3;background:rgba(0,0,0,.55);padding:7px 16px;border-radius:99px;font-weight:600;backdrop-filter:blur(6px)}
.bi{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:22px}
.bi h2{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.04em;line-height:1;font-weight:800;margin:8px 0}
.bi p{color:#d9d7e8;max-width:60ch}
.wrap{max-width:960px;margin:auto;padding:22px 20px 130px}
.wrap h3{font-size:1.1rem;font-weight:600;margin:6px 0 12px}
.dates{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.date{flex:none;padding:9px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.date.on{background:var(--red);border-color:var(--red)}
.th{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;display:block}
.th h4{font-size:1.05rem;margin-bottom:10px;font-weight:600}
.times{display:flex;gap:10px;flex-wrap:wrap}
.time{border:1px solid var(--green);color:var(--green);border-radius:10px;padding:6px 14px;font-weight:600}
.time:hover{background:#19c39a22}
.time.on{background:var(--green);color:#04201a}
.seats{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 16px;margin-top:20px;text-align:center;overflow-x:auto}
.screen{height:44px;width:72%;margin:0 auto 4px;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(rgba(255,255,255,.5),transparent);opacity:.6}
.scr-l{font-size:.8rem;color:var(--mute);margin-bottom:18px}
.row2{display:flex;justify-content:center;gap:6px;margin-bottom:6px;align-items:center}
.row2 i{width:18px;font-style:normal;color:var(--mute);font-size:.8rem}
.s{width:30px;height:28px;border-radius:8px 8px 4px 4px;border:1.5px solid var(--green);font-size:.7rem;color:var(--green)}
.s:nth-of-type(5){margin-right:22px}
.s:hover{background:#19c39a33}
.s.t{background:#232334;border-color:#232334;color:transparent;cursor:not-allowed}
.s.on{background:var(--green);color:#04201a;font-weight:700}
.tier{font-size:.78rem;color:var(--mute);margin:14px 0 6px}
.legend{display:flex;gap:18px;justify-content:center;margin-top:18px;font-size:.82rem;color:var(--mute)}
.legend u{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--green);vertical-align:-2px;margin-right:6px}
.pay{position:fixed;left:0;right:0;bottom:0;background:#14141d;border-top:1px solid var(--line);padding:14px 20px;z-index:31}
.pay div{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pay button{background:var(--red);color:#fff;padding:12px 26px;border-radius:10px;font-weight:700}
.pay button:disabled{opacity:.4;cursor:not-allowed}
.ok{text-align:center;color:var(--green);font-weight:800;font-size:1.5rem;margin-top:20px}
.ticket{max-width:400px;margin:24px auto;background:#fff;color:#1c1733;border-radius:22px;overflow:hidden}
.ticket .top{padding:24px;color:#fff;position:relative}
.ticket .top>*{position:relative;z-index:1}
.ticket .top h2{letter-spacing:-.04em;font-size:2rem;line-height:1;font-weight:800}
.ticket dl{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px;border-bottom:2px dashed #d8d3e6;position:relative}
.ticket dl::before,.ticket dl::after{content:"";position:absolute;bottom:-12px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.ticket dl::before{left:-12px}.ticket dl::after{right:-12px}
.ticket dt{font-size:.8rem;color:#6d6785}.ticket dd{font-weight:600}
.ticket .qr{padding:22px;text-align:center}
.ticket .qr svg{width:124px;height:124px}
.ticket .qr p{font-size:.85rem;color:#6d6785;margin-top:6px}
.btn{display:block;margin:0 auto;background:#fff;color:#111;padding:12px 30px;border-radius:10px;font-weight:700}

@media(max-width:760px){
  .links{display:none}.sb input{width:90px}.nb{gap:10px;flex-wrap:wrap}.logo{font-size:1.4rem}
  .thumbs,.ha{display:none}.dots{display:flex}.hc{bottom:12%}.hero{height:82vh}
  .card{width:140px}.pt h3{font-size:1.05rem}.num{font-size:7rem}.t10 .poster{width:112px}
  .s{width:24px;height:24px}.s:nth-of-type(5){margin-right:12px}.ban{height:300px}
}
@media(prefers-reduced-motion:reduce){.slide .bg>*{transform:none!important;transition:none}.slide.on .hc>*{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav class="top" id="nav"><div class="nb">
  <div class="logo">show<span>time</span></div>
  <div class="links"><a href="#trending">Home</a><a href="#toprated">Top rated</a><a href="#soon">Coming soon</a></div>
  <div class="sp"></div>
  <label class="sb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search movies" aria-label="Search movies"></label>
  <select id="city" aria-label="City"><option>Gurugram</option><option>Delhi</option><option>Mumbai</option><option>Bengaluru</option><option>Hyderabad</option></select>
  <button class="tix" onclick="myTickets()">My tickets</button>
</div></nav>
<div id="app"></div>
<div id="view" role="dialog" aria-modal="true"></div>

<script>
/* ---------- DATA ----------
   Tip: add  img:'https://…jpg'  to any movie to use a real poster/backdrop instead of the generated art. */
const movies=[
 {id:1,t:'Midnight Express 9',g:['Thriller','Mystery'],l:'Hindi',d:'2h 18m',r:'U/A',s:8.4,c:['#ff4d5e','#2a0a3a'],sc:'city',f:1,o:'A night train, nine passengers and one stolen briefcase. Nobody gets off before dawn.'},
 {id:5,t:'Orbit Zero',g:['Sci-Fi','Thriller'],l:'English',d:'2h 24m',r:'U/A',s:8.2,c:['#4a7dff','#0a0a2e'],sc:'space',f:1,o:'A repair crew on a failing station has ninety minutes of air and one working shuttle.'},
 {id:2,t:'The Last Monsoon',g:['Drama','Romance'],l:'Hindi',d:'2h 31m',r:'U',s:8.9,c:['#1fc9a0','#0b2a4a'],sc:'mount',f:1,o:'Two strangers share a rooftop in Mumbai through the longest rains in forty years.'},
 {id:8,t:'Gold Rush Road',g:['Action','Adventure'],l:'Telugu',d:'2h 52m',r:'U/A',s:8.0,c:['#ffb02e','#5a1717'],sc:'desert',f:1,o:'A truck, a map and four crews racing across the desert to a buried vault.'},
 {id:3,t:'Pixel Pirates',g:['Animation','Comedy'],l:'English',d:'1h 40m',r:'U',s:7.8,c:['#ffc93c','#c2257c'],sc:'sea',f:1,o:'A crew of game characters sails out of the arcade to find the real world.'},
 {id:4,t:'Dhoom Gully',g:['Action','Comedy'],l:'Hindi',d:'2h 45m',r:'U/A',s:7.5,c:['#ff7a3d','#2a0f5c'],sc:'city',o:'Three cousins, one wedding band and a gang that wants the drummer back.'},
 {id:6,t:'Kaveri Calling',g:['Drama'],l:'Tamil',d:'2h 09m',r:'U',s:8.6,c:['#d9953a','#12301f'],sc:'forest',o:'A retired postmaster delivers one last bundle of letters along the river.'},
 {id:7,t:'Haunted Hostel',g:['Horror','Comedy'],l:'Hindi',d:'1h 55m',r:'A',s:7.1,c:['#8a4dff','#120820'],sc:'forest',o:'First-years find out why Room 13 has been empty since 1998.'},
 {id:9,t:'Neon Nights',g:['Action','Thriller'],l:'English',d:'2h 10m',r:'U/A',s:0,c:['#ff2fb3','#07163a'],sc:'city',soon:'28 Nov',o:'A courier has one night to cross a city that has just locked every door.'},
 {id:10,t:'Deep Blue',g:['Adventure','Drama'],l:'English',d:'2h 28m',r:'U',s:0,c:['#16b8e0','#031a33'],sc:'sea',soon:'5 Dec',o:'A marine biologist follows a signal from the bottom of the Indian Ocean.'},
 {id:11,t:'Starfall',g:['Sci-Fi'],l:'Hindi',d:'2h 35m',r:'U/A',s:0,c:['#a07bff','#06061c'],sc:'space',soon:'12 Dec',o:'The night sky goes dark over Ladakh. Three astronomers know why.'},
 {id:12,t:'Sultan of Spice',g:['Comedy','Drama'],l:'Hindi',d:'2h 05m',r:'U',s:0,c:['#f2602a','#4a1208'],sc:'desert',soon:'19 Dec',o:'A street-food legend has one week to save the lane that made him famous.'}
];
const brands=['PVR Cinemas','INOX Megaplex','Cinépolis'];
const slots=[['10:30 AM','01:45 PM','05:10 PM','09:00 PM'],['11:15 AM','02:30 PM','06:20 PM','10:10 PM'],['09:50 AM','12:55 PM','04:30 PM','08:15 PM']];
const mult=[1,1.2,.9],rows='ABCDEFGH',tier=i=>i<3?180:i<6?260:380,tierName=i=>i<3?'Silver':i<6?'Gold':'Premium';
const days=[...Array(5)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const dl=d=>d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const $=s=>document.querySelector(s);
let genre='All',st={},cur=0,timer,paused=false,uid=0;

/* ---------- helpers ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const load=()=>store.get('st_b',[]);
const wl=()=>store.get('st_w',[]);
function toggleList(id){const w=wl(),i=w.indexOf(id);i<0?w.push(id):w.splice(i,1);store.set('st_w',w);home()}
function taken(key){const r=rng(hash(key)),s=new Set();rows.split('').forEach(x=>{for(let n=1;n<=10;n++)if(r()<.27)s.add(x+n)});return s}

/* ---------- generated cinematic artwork ---------- */
function art(m,w,h){
  if(m.img)return `<img class="art" src="${m.img}" alt="" loading="lazy">`;
  const r=rng(m.id*911+w),id='g'+uid++,[a,b]=m.c;let s='';
  const dots=(n,mx)=>{for(let i=0;i<n;i++)s+=`<circle cx="${r()*w}" cy="${r()*h*mx}" r="${r()*1.5+.4}" fill="#fff" opacity="${.25+r()*.6}"/>`};
  const orb=(x,y,rad,o)=>{s+=`<circle cx="${x}" cy="${y}" r="${rad*1.8}" fill="#fff" opacity="${o*.1}"/><circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" opacity="${o}"/>`};
  const ridge=(base,amp,step,o,f)=>{let p=`0,${h} `;for(let x=0;x<=w+step;x+=step)p+=`${x},${base-(f?Math.sin(x/w*f*6.283+base)*amp:r()*amp)} `;s+=`<polygon points="${p}${w+step},${h}" fill="#000" opacity="${o}"/>`};
  const city=(base,mh,o)=>{let p=`0,${h} `,x=0;while(x<w){const bw=w*(.025+r()*.05),y=base-r()*mh;p+=`${x},${y} ${x+bw},${y} `;x+=bw}s+=`<polygon points="${p}${w},${h}" fill="#000" opacity="${o}"/>`};
  const trees=(base,th,o)=>{for(let x=-20;x<w;x+=th*.5+r()*th*.3){const t=th*(.7+r()*.6);s+=`<polygon points="${x},${base} ${x+t*.28},${base-t} ${x+t*.56},${base}" fill="#000" opacity="${o}"/>`}s+=`<rect y="${base-2}" width="${w}" height="${h}" fill="#000" opacity="${o}"/>`};
  switch(m.sc){
    case'city':dots(30,.45);orb(w*.72,h*.3,h*.09,.55);city(h*.78,h*.3,.4);city(h*.88,h*.28,.7);city(h,h*.22,.95);break;
    case'mount':dots(25,.4);orb(w*.3,h*.3,h*.1,.5);ridge(h*.7,h*.3,w/9,.35,0);ridge(h*.82,h*.25,w/8,.6,0);ridge(h*.95,h*.2,w/7,.9,0);break;
    case'space':dots(130,1);s+=`<circle cx="${w*.68}" cy="${h*.4}" r="${h*.22}" fill="#fff" opacity=".16"/><ellipse cx="${w*.68}" cy="${h*.4}" rx="${h*.37}" ry="${h*.07}" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" transform="rotate(-18 ${w*.68} ${h*.4})"/>`;ridge(h*.96,h*.1,w/12,.9,0);break;
    case'sea':dots(30,.4);orb(w*.55,h*.52,h*.1,.5);s+=`<polygon points="${w*.28},${h*.62} ${w*.28},${h*.36} ${w*.36},${h*.62}" fill="#000" opacity=".8"/><polygon points="${w*.2},${h*.66} ${w*.42},${h*.66} ${w*.38},${h*.7} ${w*.24},${h*.7}" fill="#000" opacity=".85"/>`;ridge(h*.72,h*.02,w/40,.3,9);ridge(h*.84,h*.03,w/40,.55,7);ridge(h*.96,h*.03,w/40,.85,5);break;
    case'desert':orb(w*.65,h*.4,h*.16,.6);ridge(h*.7,h*.08,w/30,.35,1.4);ridge(h*.82,h*.1,w/30,.6,1.1);ridge(h*.95,h*.08,w/30,.9,1.8);break;
    default:dots(20,.4);orb(w*.8,h*.25,h*.08,.45);trees(h*.8,h*.28,.4);trees(h*.9,h*.28,.65);trees(h,h*.26,.95);
  }
  return `<svg class="art" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#${id})"/>${s}</svg>`;
}

/* ---------- home ---------- */
function card(m,rank){
  const soon=!!m.soon,inL=wl().includes(m.id);
  const c=`<article class="card" tabindex="0" role="button" aria-label="${m.t}" onclick="${soon?`toggleList(${m.id})`:`openMovie(${m.id})`}" onkeydown="if(event.key==='Enter')this.click()"><div class="poster">${art(m,400,600)}<span class="sc2 ${soon?'soon':''}">${soon?m.soon:'★ '+m.s}</span><div class="pt"><h3>${m.t}</h3><div class="hv"><div><span>${m.g[0]}</span><span>${m.d}</span><span>${m.l}</span></div><span class="mini">${soon?(inL?'Reminder set':'Remind me'):'Book now'}</span></div></div></div></article>`;
  return rank?`<div class="card" style="transform:none;box-shadow:none;cursor:default;display:flex;align-items:flex-end;width:auto"><span class="num">${rank}</span>${c.replace('class="card"','class="card" style="width:140px"')}</div>`:c;
}
function row(title,list,cls='',id=''){
  if(!list.length)return'';
  return `<section class="row ${cls}" ${id?`id="${id}"`:''}><h2>${title}</h2><div class="rw"><button class="arr l" aria-label="Scroll left" onclick="scrollRow(this,-1)">‹</button><div class="track">${list.map((m,i)=>card(m,cls==='t10'?i+1:0)).join('')}</div><button class="arr r" aria-label="Scroll right" onclick="scrollRow(this,1)">›</button></div></section>`;
}
function scrollRow(b,d){const t=b.parentElement.querySelector('.track');t.scrollBy({left:d*t.clientWidth*.85,behavior:'smooth'})}
function hero(){
  const f=movies.filter(m=>m.f);if(cur>=f.length)cur=0;
  return `<section class="hero" aria-roledescription="carousel" aria-label="Featured movies" onmouseenter="paused=true" onmouseleave="paused=false">
  ${f.map((m,i)=>`<div class="slide ${i===cur?'on':''}"><div class="bg">${art(m,1600,800)}</div><div class="hc"><div class="tg"><b class="sc">★ ${m.s}</b><b>${m.r}</b><b>${m.d}</b><b>${m.l}</b>${m.g.map(g=>`<b>${g}</b>`).join('')}</div><h2 class="ht">${m.t}</h2><p class="ds">${m.o}</p><div class="bt"><button class="play" onclick="openMovie(${m.id})">Book tickets</button><button class="ghost" onclick="toggleList(${m.id})">${wl().includes(m.id)?'✓ In watchlist':'+ Watchlist'}</button></div></div></div>`).join('')}
  <button class="ha l" aria-label="Previous" onclick="go(cur-1)">‹</button><button class="ha r" aria-label="Next" onclick="go(cur+1)">›</button>
  <div class="thumbs">${f.map((m,i)=>`<button class="th2 ${i===cur?'on':''}" aria-label="Show ${m.t}" onclick="go(${i})">${art(m,200,300)}</button>`).join('')}</div>
  <div class="dots">${f.map((m,i)=>`<button class="dot ${i===cur?'on':''}" aria-label="Slide ${i+1}" onclick="go(${i})"></button>`).join('')}</div></section>`;
}
function go(i){
  const n=movies.filter(m=>m.f).length;cur=(i+n)%n;
  ['.slide','.th2','.dot'].forEach(q=>document.querySelectorAll(q).forEach((e,k)=>e.classList.toggle('on',k===cur)));
}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!paused&&!document.hidden&&!$('#view').classList.contains('open')&&$('.hero'))go(cur+1)},6500)}
function home(){
  const city=$('#city').value,q=$('#q').value.trim().toLowerCase(),now=movies.filter(m=>!m.soon);
  const gs=['All',...new Set(movies.flatMap(m=>m.g))];
  const chips=`<div class="chips">${gs.map(g=>`<button class="chip ${g===genre?'on':''}" onclick="genre='${g}';home()">${g}</button>`).join('')}</div>`;
  let h;
  if(q||genre!=='All'){
    const res=movies.filter(m=>(genre==='All'||m.g.includes(genre))&&m.t.toLowerCase().includes(q));
    h=`<div style="height:90px"></div>${chips}<h2 class="rt" style="margin-bottom:14px">${res.length} movie${res.length===1?'':'s'} found</h2>`+(res.length?`<div class="res">${res.map(m=>card(m)).join('')}</div>`:'<p class="empty">Nothing matches that search. Try a different title or genre.</p>');
  }else{
    const w=movies.filter(m=>wl().includes(m.id));
    h=hero()+chips
     +row('My watchlist',w)
     +row('Trending in '+city,now,'','trending')
     +row('Top rated in '+city,[...now].sort((a,b)=>b.s-a.s),'t10','toprated')
     +row('Hindi blockbusters',now.filter(m=>m.l==='Hindi'))
     +row('Thrills and chills',now.filter(m=>m.g.some(g=>['Thriller','Horror','Action'].includes(g))))
     +row('Coming soon',movies.filter(m=>m.soon),'','soon');
  }
  $('#app').innerHTML=h+'<footer>Showtime is a demo project. Payments are simulated and no real tickets are issued.</footer>';
  const hr=$('.hero');
  if(hr){startTimer();let x0=0;hr.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});hr.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))},{passive:true})}
}

/* ---------- booking ---------- */
function show(html){const v=$('#view');v.innerHTML=html;v.classList.add('open');document.body.style.overflow='hidden'}
function close(){$('#view').classList.remove('open');document.body.style.overflow=''}
function openMovie(id){st={m:movies.find(m=>m.id===id),d:0,th:null,si:null,seats:new Set()};draw();$('#view').scrollTop=0}
function draw(){
  const {m}=st,city=$('#city').value,y=$('#view').scrollTop;
  let h=`<div class="ban">${art(m,1600,600)}<button class="back" onclick="close()">← Back</button><div class="bi"><div class="tg"><b class="sc">★ ${m.s}</b><b>${m.r}</b><b>${m.d}</b><b>${m.l}</b>${m.g.map(g=>`<b>${g}</b>`).join('')}</div><h2>${m.t}</h2><p>${m.o}</p></div></div><div class="wrap"><h3>Pick a date</h3>
  <div class="dates">${days.map((d,i)=>`<button class="date ${i===st.d?'on':''}" onclick="st.d=${i};st.th=null;st.si=null;st.seats.clear();draw()">${dl(d)}</button>`).join('')}</div><h3>Choose a showtime</h3>`;
  h+=brands.map((b,ti)=>`<div class="th"><h4>${b}, ${city}</h4><div class="times">${slots[ti].map((t,si)=>`<button class="time ${st.th===ti&&st.si===si?'on':''}" onclick="pickShow(${ti},${si})">${t}</button>`).join('')}</div></div>`).join('');
  if(st.th!==null){
    const tk=taken([m.id,st.d,st.th,st.si,city].join('|'));
    h+=`<h3 style="margin-top:22px">Select your seats</h3><div class="seats"><div class="screen"></div><p class="scr-l">All eyes this way</p>`;
    rows.split('').forEach((r,i)=>{
      if(i===0||tier(i)!==tier(i-1))h+=`<p class="tier">${tierName(i)}, ₹${Math.round(tier(i)*mult[st.th])}</p>`;
      h+=`<div class="row2"><i>${r}</i>`+[...Array(10)].map((_,n)=>{const id=r+(n+1),t=tk.has(id);return `<button class="s ${t?'t':''} ${st.seats.has(id)?'on':''}" ${t?'disabled':''} aria-label="Seat ${id}${t?' sold':''}" onclick="seat('${id}')">${n+1}</button>`}).join('')+`</div>`;
    });
    h+=`<div class="legend"><span><u></u>Available</span><span><u style="background:var(--green)"></u>Selected</span><span><u style="background:#232334;border-color:#232334"></u>Sold</span></div></div>`;
  }
  h+=`</div>`;
  if(st.th!==null){const n=st.seats.size;h+=`<div class="pay"><div><span>${n?n+' seat'+(n>1?'s':'')+': '+[...st.seats].sort().join(', '):'Select your seats'}</span><button ${n?'':'disabled'} onclick="pay()">Pay ₹${total()}</button></div></div>`}
  show(h);$('#view').scrollTop=y;
}
function pickShow(ti,si){st.th=ti;st.si=si;st.seats.clear();draw();setTimeout(()=>document.querySelector('.seats')?.scrollIntoView({behavior:'smooth',block:'center'}),30)}
function seat(id){st.seats.has(id)?st.seats.delete(id):st.seats.size<8?st.seats.add(id):alert('You can book up to 8 seats at a time.');draw()}
function total(){return [...st.seats].reduce((a,s)=>a+Math.round(tier(rows.indexOf(s[0]))*mult[st.th]),0)}
function pay(){
  const b={id:'ST'+(hash(Date.now()+'')%1e6).toString().padStart(6,'0'),mid:st.m.id,th:brands[st.th]+', '+$('#city').value,date:dl(days[st.d]),time:slots[st.th][st.si],seats:[...st.seats].sort(),total:total()};
  store.set('st_b',[b,...load()]);ticket(b,true);
}
function qr(id){const r=rng(hash(id));let s='';for(let y=0;y<13;y++)for(let x=0;x<13;x++){const f=(x<3&&y<3)||(x>9&&y<3)||(x<3&&y>9);if(f||r()<.5)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 13 13" fill="#1c1733" role="img" aria-label="Ticket code">${s}</svg>`}
function ticket(b,fresh){
  const m=movies.find(x=>x.id===b.mid);
  show(`<div class="wrap" style="padding-top:30px">${fresh?'<p class="ok">Booking confirmed</p>':'<button class="back" style="position:static;margin-bottom:10px" onclick="myTickets()">← All tickets</button>'}
  <div class="ticket"><div class="top">${art(m,400,200)}<h2>${m.t}</h2><p>${m.l}, ${m.r}</p></div>
  <dl><div><dt>Date</dt><dd>${b.date}</dd></div><div><dt>Time</dt><dd>${b.time}</dd></div><div style="grid-column:span 2"><dt>Theatre</dt><dd>${b.th}</dd></div><div><dt>Seats</dt><dd>${b.seats.join(', ')}</dd></div><div><dt>Paid</dt><dd>₹${b.total}</dd></div></dl>
  <div class="qr">${qr(b.id)}<p>Booking ID ${b.id}</p></div></div>
  <button class="btn" onclick="close()">Done</button></div>`);
}
function myTickets(){
  const a=load();
  show(`<div class="wrap" style="padding-top:20px"><button class="back" style="position:static;margin-bottom:18px" onclick="close()">← Back to movies</button><h2 style="font-size:2.2rem;letter-spacing:-.04em;margin-bottom:18px">My tickets</h2>`+
  (a.length?a.map((b,i)=>{const m=movies.find(x=>x.id===b.mid);return `<button class="th" style="width:100%;text-align:left" onclick="ticket(load()[${i}],false)"><h4>${m.t}</h4><span style="color:var(--mute)">${b.date}, ${b.time}, seats ${b.seats.join(', ')}</span></button>`}).join(''):'<p class="empty" style="padding:0">No tickets yet. Pick a movie and choose your seats to book one.</p>')+'</div>');
}

/* ---------- init ---------- */
$('#city').onchange=home;$('#q').oninput=home;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
addEventListener('scroll',()=>$('#nav').classList.toggle('solid',scrollY>40),{passive:true});
home();
</script>
</body>
</html>
